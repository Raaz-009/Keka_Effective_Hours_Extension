<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keka Effective Hours</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 250px;
        margin: 0;
        padding: 15px 16px 13px;
        font:
          12px/1.4 "Poppins",
          Arial,
          sans-serif;
        color: #0f1824;
        background: #fff;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1e293b;
        flex: none;
      }
      .subtitle {
        margin: 0 0 13px;
        color: #64748b;
        font-size: 11px;
        line-height: 1.4;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      label {
        display: block;
        color: #475569;
        font-size: 11px;
        font-weight: 600;
      }
      input {
        display: block;
        width: 100%;
        height: 34px;
        margin-top: 4px;
        padding: 7px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: #fff;
        color: #0f1824;
        font:
          13px "Poppins",
          Arial,
          sans-serif;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.13);
      }
      button {
        width: 100%;
        height: 34px;
        margin-top: 11px;
        border: 0;
        border-radius: 7px;
        background: linear-gradient(135deg, #0f1824, #1e293b);
        color: #fff;
        cursor: pointer;
        font:
          600 12px "Poppins",
          Arial,
          sans-serif;
      }
      button:hover {
        opacity: 0.92;
      }
      #show-details {
        margin-top: 7px;
        background: #eef2f7;
        color: #334155;
        border: 1px solid #dbe3ed;
      }
      #show-details:hover {
        background: #e2e8f0;
      }
      #status {
        min-height: 16px;
        margin-top: 7px;
        color: #16803c;
        font-size: 10px;
      }
      .divider {
        height: 1px;
        margin: 8px 0 9px;
        background: #e2e8f0;
      }
      .credit {
        text-align: center;
        color: #94a3b8;
        font:
          500 10px "Poppins",
          Arial,
          sans-serif;
        letter-spacing: 0.45px;
      }
      .credit span {
        color: #475569;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1 class="title"><span class="dot"></span>Keka Effective Hours</h1>
    <p class="subtitle">
      Set the effective-hours target for a valid attendance day.
    </p>
    <div class="fields">
      <label for="hours"
        >Hours<input id="hours" type="number" min="0" max="24" step="1"
      /></label>
      <label for="minutes"
        >Minutes<input id="minutes" type="number" min="0" max="59" step="1"
      /></label>
    </div>
    <button id="save">Save target</button>
    <button id="show-details">Show details</button>

    <div class="divider"></div>
    <div class="credit">Built by <span>Raaz</span></div>
    <script src="popup.js"></script>
  </body>
</html>
